name: Install Compact Village Frames
on:
  push:
    branches: [main]
    paths:
      - 'assets/.compact-part4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct approved pixel-art assets
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib
          parts=[Path(f'assets/.compact-part{i}').read_text().strip() for i in (1,2,3,4)]
          data=base64.b64decode(''.join(parts),validate=True)
          im=Image.open(__import__('io').BytesIO(data))
          assert im.size == (240,160), f'Unexpected sprite atlas size: {im.size}'
          assert im.mode == 'RGBA', f'Expected transparent RGBA, got {im.mode}'
          assert im.getchannel('A').getextrema()[0] == 0, 'Missing transparency'
          Path('assets/village-compact.webp').write_bytes(data)
          print('Installed village sprites:',len(data),'bytes',hashlib.sha256(data).hexdigest())
          PY
      - name: Commit verified art and clean staging parts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/village-compact.webp
          git rm -f assets/.compact-part{1,2,3,4}
          git commit -m "Install final compact village pixel-art atlas"
          git push origin HEAD:main
