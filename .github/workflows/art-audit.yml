name: Village art audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/art-audit.yml'
      - 'tools/audit_environment_art.py'
      - 'src/renderer.js'
      - 'src/village-art.js'
      - 'tests/village-art.mjs'
      - 'assets/village-buildings.webp'
      - 'src/forge-animation.js'
      - 'tests/forge-animation.mjs'
      - 'src/map-editor.js'
      - 'src/map-editor-data.js'
      - 'tests/map-editor.mjs'
      - 'src/assets.js'
      - 'src/pixel-art-sharp.js'
      - 'tests/pixel-art-sharp.mjs'
      - 'tests/mechanics.mjs'
      - 'assets/hero-walk*'
      - 'tools/prepare_hero_walk.py'
      - 'tests/hero_walk_art.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Inspect environmental tiles and isolate possible stray pixels
        run: python3 tools/audit_environment_art.py
      - name: Verify game mechanics
        run: node tests/mechanics.mjs
      - name: Verify crisp non-blurred buildings
        run: node tests/pixel-art-sharp.mjs
      - name: Verify six houses, correct doors and animated fountain
        run: node tests/village-art.mjs
      - name: Verify forge chimney, flame and smoke alignment
        run: node tests/forge-animation.mjs
      - name: Verify interactive map editor and autosave
        run: node tests/map-editor.mjs
      - name: Verify alternating hero boot artwork
        run: python3 tests/hero_walk_art.py
