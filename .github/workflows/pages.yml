name: Deploy current game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install --quiet Pillow
      - run: python3 tests/vector-npcs-art.py
      - run: node tests/mechanics.mjs
      - run: node tests/pixel-art-sharp.mjs
      - run: python3 tests/tavern-image.py
      - run: node tests/village-art.mjs
      - run: node tests/forge-animation.mjs
      - run: node tests/map-editor.mjs
      - run: node tests/animation.mjs
      - run: python3 tests/hero-druid-art.py
      - run: node tests/visibility.mjs
      - run: node tools/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish complete release
        id: deployment
        uses: actions/deploy-pages@v4
