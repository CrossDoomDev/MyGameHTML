<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26342a">
<meta name="description" content="Тихолесье — пиксельный RPG-мир: просторная деревня, огромный лес с врагами и таверна.">
<title>Тихолесье · Лесная деревня</title><link rel="stylesheet" href="style.css">
</head>
<body><main id="app">
<canvas id="game" aria-label="Тихолесье. WASD — движение, пробел — атака, E — общение." tabindex="0"></canvas>
<canvas id="npcOverlay" aria-hidden="true"></canvas>
<div id="loading"><div class="loading-leaf">✦</div><strong>Тихолесье</strong><span>Просыпается лес…</span></div>
<div id="hud"><div class="portrait wood-frame"><canvas id="portrait" width="48" height="48"></canvas><span id="level">1</span></div><div class="vitals wood-frame"><div class="bar health"><i id="hpFill"></i><span id="hpText">120 / 120</span></div><div class="bar mana"><i id="manaFill"></i><span id="manaText">60 / 60</span></div><div class="xp"><i id="xpFill"></i></div></div></div>
<div id="location"><span class="location-mark">✦</span><div><strong>Тихолесье</strong><span id="region">Деревня Тихолесье</span></div></div>
<button id="minimapButton" class="wood-frame" aria-label="Открыть карту (M)"><span id="sun">☀</span><canvas id="minimap" width="144" height="104"></canvas><span class="map-caption">M · КАРТА</span></button>
<div id="quest"><span class="quest-mark">!</span><div><strong id="questTitle">Просьба старосты</strong><span id="questText">Поговори со старостой у таверны</span></div><button id="journal" aria-label="Журнал (J)">›</button></div>
<div id="interaction" hidden>E <span>Поговорить</span></div>
<div id="hotbar" class="wood-frame" aria-label="Быстрые предметы">
<button class="slot selected" data-slot="0" title="Посох · атака (1 / пробел)"><kbd>1</kbd><span class="item item-staff"></span></button>
<button class="slot" data-slot="1" title="Лесные травы (2)"><kbd>2</kbd><span class="item item-herb"></span><small id="herbCount">0</small></button>
<button class="slot" data-slot="2" title="Зелье (3)"><kbd>3</kbd><span class="item item-potion"></span><small id="potionCount">2</small></button>
<button class="slot" data-slot="3" title="Древесина (4)"><kbd>4</kbd><span class="item item-wood"></span><small id="woodCount">0</small></button>
<button class="slot" data-slot="4" title="Рюкзак (5 / B)"><kbd>5</kbd></button>
<button class="slot" data-slot="5" title="Журнал (6 / J)"><kbd>6</kbd></button>
</div>
<div id="skillbar" class="wood-frame" aria-label="Способности друида">
<button id="skill-bolt" class="skill" data-skill="bolt" type="button" title="Q · Изумрудный луч · 10 маны" aria-label="Изумрудный луч, Q"><span class="skill-rune">✦</span><kbd>Q</kbd><small class="skill-timer"></small></button>
<button id="skill-roots" class="skill" data-skill="roots" type="button" title="R · Цепкие корни · 18 маны" aria-label="Цепкие корни, R"><span class="skill-rune">♣</span><kbd>R</kbd><small class="skill-timer"></small></button>
<button id="skill-heal" class="skill" data-skill="heal" type="button" title="F · Живительный рост · 16 маны" aria-label="Живительный рост, F"><span class="skill-rune">✚</span><kbd>F</kbd><small class="skill-timer"></small></button>
</div>
<div id="actions">
<button id="bag" class="wood-frame" title="Рюкзак (B)" aria-label="Рюкзак"><span class="item item-bag"></span><kbd>B</kbd></button>
<button id="map" class="wood-frame" title="Карта (M)" aria-label="Карта"><span class="item item-map"></span><kbd>M</kbd></button>
<button id="journalAction" class="wood-frame" title="Журнал (J)" aria-label="Журнал"><span class="item item-journal"></span><kbd>J</kbd></button>
<button id="settings" class="wood-frame" title="Настройки (Esc)" aria-label="Настройки"><span class="item item-settings"></span><kbd>Esc</kbd></button>
</div>
<div id="hint">WASD · движение <span>Пробел · атака</span> Q · луч · R · корни · F · лечение</div>
<div id="mobileActions"><button id="mobileInteract" aria-label="Взаимодействовать">E</button><button id="mobileAttack" aria-label="Атаковать">⚔</button></div><div id="joystick" aria-label="Джойстик движения"><i></i></div>
<div id="panelBackdrop" hidden><section id="panel" class="wood-frame" role="dialog" aria-modal="true" aria-labelledby="panelTitle"></section></div>
<aside id="editorPanel" hidden aria-label="Редактор игрового мира"></aside><div id="toast" role="status" aria-live="polite"></div><span id="build">ПРОТОТИП · 0.6</span>
</main><script type="module" src="src/main.js"></script></body></html>
