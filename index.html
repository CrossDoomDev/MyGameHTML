<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26342a">
<meta name="description" content="Тихолесье — пиксельный RPG-мир: просторная деревня, огромный лес с врагами и таверна.">
<title>Тихолесье · Лесная деревня</title><link rel="stylesheet" href="style.css">
</head>
<body><main id="app">
<canvas id="game" aria-label="Тихолесье. WASD — движение, пробел — атака, E — общение." tabindex="0"></canvas>
<canvas id="npcOverlay" aria-hidden="true"></canvas>
<div id="loading"><div class="loading-leaf">✦</div><strong data-i18n="gameName">Тихолесье</strong><span data-i18n="loading">Просыпается лес…</span></div>
<div id="hud"><div class="portrait wood-frame"><canvas id="portrait" width="48" height="48"></canvas><span id="level">1</span></div><div class="vitals wood-frame"><div class="bar health"><i id="hpFill"></i><span id="hpText">120 / 120</span></div><div class="bar mana"><i id="manaFill"></i><span id="manaText">60 / 60</span></div><div class="xp"><i id="xpFill"></i></div></div></div>
<div id="location"><span class="location-mark">✦</span><div><strong data-i18n="gameName">Тихолесье</strong><span id="region">Деревня Тихолесье</span></div></div>
<div id="combatFocus" class="wood-frame" aria-label="Выбранный противник" data-i18n-aria="combatTarget" hidden><span class="combat-focus-icon">◎</span><span><strong id="combatFocusName">Противник</strong><small id="combatFocusHealth">0 / 0</small><small data-i18n="unfocus">ЛКМ по земле — снять фокус</small></span></div>
<button id="minimapButton" class="wood-frame" aria-label="Открыть карту (M)" data-i18n-aria="map"><span id="sun">☀</span><canvas id="minimap" width="144" height="104"></canvas><span class="map-caption">M · <span data-i18n="map">КАРТА</span></span></button>
<div id="quest"><span class="quest-mark">!</span><div><strong id="questTitle">Просьба старосты</strong><span id="questText">Поговори со старостой у таверны</span></div><button id="journal" aria-label="Журнал (J)">›</button></div>
<div id="trainingStats" class="training-stats" role="status" hidden></div>
<div id="interaction" hidden>E <span>Поговорить</span></div>
<div id="hotbar" class="wood-frame" aria-label="Единая панель способностей и предметов" data-i18n-aria="hotbar">
<div id="skillbar" aria-label="Способности друида">
<button id="skill-bolt" class="skill" data-skill="bolt" type="button" title="Изумрудный луч · ЛКМ или Q: применить, ПКМ: назначить основной атакой · 10 маны" aria-label="Изумрудный луч, Q" aria-pressed="false"><span class="game-icon" data-icon="skill_bolt" aria-hidden="true"></span><kbd>Q</kbd><small class="skill-timer"></small></button>
<button id="skill-roots" class="skill" data-skill="roots" type="button" title="R · Цепкие корни · 18 маны" aria-label="Цепкие корни, R"><span class="game-icon" data-icon="skill_roots" aria-hidden="true"></span><kbd>R</kbd><small class="skill-timer"></small></button>
<button id="skill-heal" class="skill" data-skill="heal" type="button" title="F · Живительный рост · 16 маны" aria-label="Живительный рост, F"><span class="game-icon" data-icon="skill_heal" aria-hidden="true"></span><kbd>F</kbd><small class="skill-timer"></small></button>
</div>
<span class="hotbar-divider" aria-hidden="true"></span>
<div id="quickbar" aria-label="Быстрые ячейки" data-i18n-aria="quickbar">
<button id="primaryStaff" class="slot selected primary-attack" data-slot="0" type="button" aria-pressed="true" title="Посох · ЛКМ: ударить, ПКМ: назначить основной атакой"><kbd>1</kbd><span class="item item-staff"></span></button>
<button class="slot" data-slot="1" title="Лесные травы (2)"><kbd>2</kbd><span class="item item-herb"></span><small id="herbCount">0</small></button>
<button class="slot" data-slot="2" title="Зелье (3)"><kbd>3</kbd><span class="item item-potion"></span><small id="potionCount">2</small></button>
<button class="slot" data-slot="3" title="Древесина (4)"><kbd>4</kbd><span class="item item-wood"></span><small id="woodCount">0</small></button>
<button class="slot" data-slot="4" title="Рюкзак (5 / B)"><kbd>5</kbd><span class="item item-bag"></span></button>
<button class="slot" data-slot="5" title="Журнал (6 / J)"><kbd>6</kbd><span class="item item-journal"></span></button>
<button class="slot empty-slot" data-slot="6" type="button" title="Ячейка 7 свободна для предметов и расходников" aria-label="Ячейка 7: свободна"><kbd>7</kbd><span class="empty-mark">+</span></button>
<button class="slot empty-slot" data-slot="7" type="button" title="Ячейка 8 свободна для предметов и расходников" aria-label="Ячейка 8: свободна"><kbd>8</kbd><span class="empty-mark">+</span></button>
<button class="slot empty-slot" data-slot="8" type="button" title="Ячейка 9 свободна для предметов и расходников" aria-label="Ячейка 9: свободна"><kbd>9</kbd><span class="empty-mark">+</span></button>
<button class="slot empty-slot" data-slot="9" type="button" title="Ячейка 0 свободна для предметов и расходников" aria-label="Ячейка 0: свободна"><kbd>0</kbd><span class="empty-mark">+</span></button>
</div>
</div>
<div id="actions" class="forest-action-dock" aria-label="Игровое меню" data-i18n-aria="actions">
 <div class="forest-action-heading" aria-hidden="true"><span data-i18n="menu">МЕНЮ</span></div>
 <div class="forest-action-grid">
 <button id="characterAction" class="forest-action-button" type="button" title="Персонаж и экипировка (I)" aria-label="Персонаж и экипировка (I)" data-i18n-title="character" data-i18n-aria="character"><span class="forest-action-art" style="--icon-x:0.0000%" aria-hidden="true"></span><kbd>I</kbd></button>
 <button id="bag" class="forest-action-button" type="button" title="Инвентарь (B)" aria-label="Инвентарь (B)" data-i18n-title="inventory" data-i18n-aria="inventory"><span class="forest-action-art" style="--icon-x:14.2857%" aria-hidden="true"></span><kbd>B</kbd></button>
 <button id="skillsAction" class="forest-action-button" type="button" title="Способности друида" aria-label="Способности друида" data-i18n-title="abilities" data-i18n-aria="abilities"><span class="forest-action-art" style="--icon-x:28.5714%" aria-hidden="true"></span></button>
 <button id="map" class="forest-action-button" type="button" title="Карта (M)" aria-label="Карта (M)" data-i18n-title="map" data-i18n-aria="map"><span class="forest-action-art" style="--icon-x:42.8571%" aria-hidden="true"></span><kbd>M</kbd></button>
 <button id="questsAction" class="forest-action-button" type="button" title="Задания" aria-label="Задания" data-i18n-title="quests" data-i18n-aria="quests"><span class="forest-action-art" style="--icon-x:57.1429%" aria-hidden="true"></span></button>
 <button id="chatAction" class="forest-action-button" type="button" title="Общение — скоро появится" aria-label="Общение — скоро появится" data-i18n-title="chat" data-i18n-aria="chat"><span class="forest-action-art" style="--icon-x:71.4286%" aria-hidden="true"></span></button>
 <button id="settings" class="forest-action-button" type="button" title="Настройки (Esc)" aria-label="Настройки (Esc)" data-i18n-title="settings" data-i18n-aria="settings"><span class="forest-action-art" style="--icon-x:85.7143%" aria-hidden="true"></span><kbd>Esc</kbd></button>
 <button id="journalAction" class="forest-action-button" type="button" title="Дорожный журнал (J)" aria-label="Дорожный журнал (J)" data-i18n-title="journal" data-i18n-aria="journal"><span class="forest-action-art" style="--icon-x:100.0000%" aria-hidden="true"></span><kbd>J</kbd></button>
 </div>
</div>
<div id="hint" data-i18n="hint">I · персонаж и снаряжение; Пробел · атака; Q / R / F · способности; 1–0 · быстрые ячейки</div>
<div id="mobileActions"><button id="mobileInteract" aria-label="Взаимодействовать" data-i18n-aria="mobileInteract">E</button><button id="mobileAttack" aria-label="Атаковать" data-i18n-aria="mobileAttack">⚔</button></div><div id="joystick" aria-label="Джойстик движения" data-i18n-aria="movement"><i></i></div>
<div id="panelBackdrop" hidden><section id="panel" class="wood-frame" role="dialog" aria-modal="true" aria-labelledby="panelTitle"></section></div>
<aside id="editorPanel" hidden aria-label="Редактор игрового мира"></aside><div id="toast" role="status" aria-live="polite"></div><span id="build" data-i18n="prototype">ПРОТОТИП · 0.12</span>
</main><script type="module" src="src/main.js"></script></body></html>
